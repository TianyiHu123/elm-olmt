# Example OLMT config: prepare-only + external startup-finidat initialization
# (Phase 03B-B feature demonstration)
#
# Run with:
#     python elm_olmt_Tianyi.py --config examples/external_finidat_prepare_only.cfg --prepare-only
#
# --prepare-only creates, configures, and builds the cases, generates the OLMT
# Slurm scripts and case pickles, and then EXITS WITHOUT submitting any job.
#
# The [external_initialization] section makes the transient (20TR) stage
# initialize with RUN_TYPE=startup from an externally supplied ELM restart,
# independent of the (possibly unexecuted) AD/final spinup cases:
#   * RUN_STARTDATE is set to the external restart's year (or start_year).
#   * The effective ELM namelist finidat points to the external restart.
#   * No CIME branch restart, no RUN_REFCASE/REFDATE/REFTOD, no coupler/DATM
#     restart staging, and no rpointer generation.
#   * The transient has no initialization or Slurm dependency on the new spinups.
# The external restart file is never modified; its path and SHA256 are recorded
# in the case pickle metadata.
#
# External initialization is currently rejected for ensemble runs (parm_list set);
# member-specific external restarts are a documented future integration point in
# ensemble_copy().

[machine]
machine_name = 'pm-cpu'
modelroot = '/path/to/E3SM'
inputdata = '/global/cfs/cdirs/e3sm/inputdata'
ptclminfodata = '/path/to/E3SM/components/elm/tools/PTCLM/PTCLM_ctsmneon'
caseroot = '/path/to/campaign/case/ABBY/olmt_prepare'
runroot = '/path/to/campaign/ABBY/olmt_prepare'
exeroot = ''
queue = shared
project = m4803
olmt_condaenv = 'OLMT_pm'

[simulation]
runtype = site
sites = ABBY
case_names = ABBY_ctrlvertsoc_prep
sitegroup = PTCLMDATA
res = hcru_hcru
mettype = site
metdir = '/path/to/PTCLM/NEON/CTSM_NEON/ABBY'
use_cpl_bypass = False

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC
use_hydrstress = False
use_fates = False
fates_pft = 0
pft_duplicates = 0
use_crop = False

[run_lengths]
nyears_ad = 200
nyears_final = 200
nyears_trans = 1
nyear_spinup_cycle = 5
trans_startyear = 2019

walltime_ad = 02:00:00
walltime_final = 02:00:00
walltime_trans = 00:30:00

[case_options]
domainfile = '/path/to/PTCLM/NEON/CTSM_NEON/ABBY/domain.lnd.1x1pt_ABBY.nc'
surffile = '/path/to/PTCLM/NEON/CTSM_NEON/ABBY/surfdata_1x1_NEON_ABBY_hist_2000_c260408.nc'
flanduse_timeseries = ''
srcmods = '/path/to/campaign/SourceMods/control-baseline'
paramfile = '/global/cfs/cdirs/e3sm/inputdata/lnd/clm2/paramdata/clm_params_c211124.nc'
use_nofire = .true.
use_vertsoilc  = .true.

[external_initialization]
target_stage = transient
mode = startup_finidat
finidat = /path/to/campaign/ABBY/control/<control_case>/run/<control_case>.elm.r.2019-01-01-00000.nc
start_year = 2019

[postprocessing]
variables = GPP, HR, LITR3C, K_LITR3, T_SCALAR, W_SCALAR, O_SCALAR
startyear = 2019
endyear   = 2019
frequency = hourly
