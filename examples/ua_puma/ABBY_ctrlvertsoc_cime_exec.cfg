# Phase 6 standalone ABBY cfg for the CIME-submit path (6C / 6D step 1).
# Science settings match Perlmutter ABBY_ctrlvertsoc. Paths are Puma-only.
# Do not point caseroot/runroot at Phase 5 elm_puma_abby_* cases or SOIL_project.

[machine]
machine_name = 'ua-puma9'
compiler = gnu
mpilib = openmpi
modelroot = '/xdisk/chopinsong/tianyihu/E3SM_Hu'
inputdata = '/xdisk/chopinsong/tianyihu/e3sm_inputdata'
ptclminfodata = '/xdisk/chopinsong/tianyihu/E3SM_Hu/components/elm/tools/PTCLM/PTCLM_ctsmneon'
caseroot = '/xdisk/chopinsong/tianyihu/E3SM_port/cases/olmt_abby/cime_exec'
runroot = '/xdisk/chopinsong/tianyihu/E3SM_out/port_uapuma/olmt_abby/cime_exec'
exeroot = ''
queue = standard
project = chopinsong
olmt_condaenv = 'OLMT_puma'

[simulation]
runtype = site
sites = ABBY
case_names = ABBY_ctrlvertsoc
sitegroup = PTCLMDATA

res = hcru_hcru
mettype = site
# Parent of 1x1pt_ABBY/CLM1PT_data; OLMT appends that leaf for site mettype.
metdir = '/xdisk/chopinsong/tianyihu/E3SM_out/PTCLM/NEON/CTSM_NEON/ABBY'
use_cpl_bypass = False

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC
use_hydrstress = False

use_fates = False
fates_pft = 0
pft_duplicates = 0

use_crop = False

[run_lengths]
nyears_ad = 200
nyears_final = 200
nyears_trans = 7
nyear_spinup_cycle = 5
trans_startyear = 2018

# Phase 5 GNU margin (Perlmutter cfg was 02:00:00 / 02:00:00 / 00:30:00)
walltime_ad = 03:00:00
walltime_final = 03:00:00
walltime_trans = 01:00:00

# No ensemble: standalone three-stage chain only.

[case_options]
domainfile = '/xdisk/chopinsong/tianyihu/E3SM_out/PTCLM/NEON/CTSM_NEON/ABBY/domain.lnd.1x1pt_ABBY.nc'
surffile = '/xdisk/chopinsong/tianyihu/E3SM_out/PTCLM/NEON/CTSM_NEON/ABBY/surfdata_1x1_NEON_ABBY_hist_2000_c260408.nc'
flanduse_timeseries = ''
srcmods = '/xdisk/chopinsong/tianyihu/E3SM_Hu/case_run/Scripts/SOIL_project/SourceMods/control'
paramfile = '/xdisk/chopinsong/tianyihu/E3SM_out/port_uapuma/abby_params/clm_params.nc'
use_nofire = .true.
use_vertsoilc  = .true.

[postprocessing]
variables = GPP, NEE, ER, SR, HR, H2OSOI, TSOI, SMP,
            LEAFC, FROOTC, LIVESTEMC, DEADSTEMC, LIVECROOTC, DEADCROOTC,
            LEAFN, FROOTN, LIVESTEMN, DEADSTEMN, LIVECROOTN, DEADCROOTN,
            LEAFP, FROOTP, LIVESTEMP, DEADSTEMP, LIVECROOTP, DEADCROOTP,
            RETRANSN, RETRANSP,
            CWDC, LITR1C, LITR2C, LITR3C, SOIL1C, SOIL2C, SOIL3C, SOIL4C,
            CWDC_HR, LITR1_HR, LITR2_HR, LITR3_HR, SOIL1_HR, SOIL2_HR, SOIL3_HR, SOIL4_HR,
            T_SCALAR, W_SCALAR, O_SCALAR,
            FPI,FPI_P,
            K_CWD,K_LITR1,K_LITR2,K_LITR3,
            K_SOIL1,K_SOIL2,K_SOIL3,K_SOIL4,
            LEAFC_TO_LITTER,FROOTC_TO_LITTER,LITFALL,
            LEAFN_TO_LITTER,FROOTN_TO_LITTER,
            LEAFP_TO_LITTER,FROOTP_TO_LITTER
startyear = 2018
endyear   = 2024
frequency = hourly
